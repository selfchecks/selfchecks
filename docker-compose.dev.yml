name: selfchecks-dev

services:
  postgres:
    container_name: selfchecks-dev-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-selfchecks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-selfchecks}
      POSTGRES_USER: ${POSTGRES_USER:-selfchecks}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-selfchecks} -d $${POSTGRES_DB:-selfchecks}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - selfchecks-dev
    ports:
      - "${SELFCHECKS_DEV_POSTGRES_PORT:-15432}:5432"
    volumes:
      - selfchecks-dev-postgres-data:/var/lib/postgresql/data

  redis:
    container_name: selfchecks-dev-redis
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - selfchecks-dev
    ports:
      - "${SELFCHECKS_DEV_REDIS_PORT:-16379}:6379"
    volumes:
      - selfchecks-dev-redis-data:/data

networks:
  selfchecks-dev:
    name: selfchecks-dev-network

volumes:
  selfchecks-dev-postgres-data:
    name: selfchecks-dev-postgres-data
  selfchecks-dev-redis-data:
    name: selfchecks-dev-redis-data
