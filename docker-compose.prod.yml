name: selfchecks-prod

x-selfchecks-web-image: &selfchecks-web-image ghcr.io/selfchecks/selfchecks-web:${SELFCHECKS_IMAGE_TAG:-stable}
x-selfchecks-worker-image: &selfchecks-worker-image ghcr.io/selfchecks/selfchecks-worker:${SELFCHECKS_IMAGE_TAG:-stable}

services:
  postgres:
    container_name: selfchecks-prod-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-selfchecks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the production env file}
      POSTGRES_USER: ${POSTGRES_USER:-selfchecks}
    expose:
      - "5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-selfchecks} -d $${POSTGRES_DB:-selfchecks}",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - selfchecks-prod
    volumes:
      - selfchecks-prod-postgres-data:/var/lib/postgresql/data

  redis:
    container_name: selfchecks-prod-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - selfchecks-prod
    volumes:
      - selfchecks-prod-redis-data:/data

  migrate:
    image: *selfchecks-web-image
    command: ["yarn", "db:migrate:deploy"]
    container_name: selfchecks-prod-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the production env file}
    networks:
      - selfchecks-prod
    restart: "no"

  web:
    image: *selfchecks-web-image
    container_name: selfchecks-prod-web
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the production env file}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in the production env file}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      SELFCHECKS_QUEUED_RUN_TIMEOUT_MINUTES: ${SELFCHECKS_QUEUED_RUN_TIMEOUT_MINUTES:-30}
      SELFCHECKS_RUNNING_RUN_TIMEOUT_MINUTES: ${SELFCHECKS_RUNNING_RUN_TIMEOUT_MINUTES:-120}
      SELFCHECKS_ADMIN_LOGIN: ${SELFCHECKS_ADMIN_LOGIN:-}
      SELFCHECKS_ADMIN_PASSWORD: ${SELFCHECKS_ADMIN_PASSWORD:-}
      SELFCHECKS_ARTIFACTS_DIR: ${SELFCHECKS_ARTIFACTS_DIR:-/app/runtime/artifacts}
      SELFCHECKS_CADDY_ADMIN_URL: ${SELFCHECKS_CADDY_ADMIN_URL:-http://caddy:2019}
      SELFCHECKS_CADDY_ADMIN_ORIGIN: ${SELFCHECKS_CADDY_ADMIN_ORIGIN:-http://0.0.0.0:2019}
      SELFCHECKS_CADDY_CONFIG_PATH: ${SELFCHECKS_CADDY_CONFIG_PATH:-/app/runtime/Caddyfile}
      SELFCHECKS_CADDY_UPSTREAM: ${SELFCHECKS_CADDY_UPSTREAM:-web:3000}
      SELFCHECKS_CHECKS_ROOT: ${SELFCHECKS_CHECKS_ROOT:-}
      SELFCHECKS_CONFIG_PATH: ${SELFCHECKS_CONFIG_PATH:-/app/runtime/selfchecks.config.json}
      SELFCHECKS_QUEUE_NAME: ${SELFCHECKS_QUEUE_NAME:-selfchecks-checks}
      SELFCHECKS_SETUP_TOKEN: ${SELFCHECKS_SETUP_TOKEN:-}
      SELFCHECKS_WEBHOOK_TIMEOUT_MS: ${SELFCHECKS_WEBHOOK_TIMEOUT_MS:-5000}
    expose:
      - "3000"
    networks:
      - selfchecks-prod
    restart: unless-stopped
    volumes:
      - ./runtime:/app/runtime

  worker:
    image: *selfchecks-worker-image
    container_name: selfchecks-prod-worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the production env file}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in the production env file}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      SELFCHECKS_QUEUED_RUN_TIMEOUT_MINUTES: ${SELFCHECKS_QUEUED_RUN_TIMEOUT_MINUTES:-30}
      SELFCHECKS_RUNNING_RUN_TIMEOUT_MINUTES: ${SELFCHECKS_RUNNING_RUN_TIMEOUT_MINUTES:-120}
      SELFCHECKS_ARTIFACTS_DIR: ${SELFCHECKS_ARTIFACTS_DIR:-/app/runtime/artifacts}
      SELFCHECKS_CHECKS_ROOT: ${SELFCHECKS_CHECKS_ROOT:-}
      SELFCHECKS_QUEUE_NAME: ${SELFCHECKS_QUEUE_NAME:-selfchecks-checks}
      SELFCHECKS_SCHEDULER_ENABLED: ${SELFCHECKS_SCHEDULER_ENABLED:-1}
      SELFCHECKS_SCHEDULER_INTERVAL_MS: ${SELFCHECKS_SCHEDULER_INTERVAL_MS:-60000}
      SELFCHECKS_SCHEDULER_REPORTER: ${SELFCHECKS_SCHEDULER_REPORTER:-list}
    networks:
      - selfchecks-prod
    restart: unless-stopped
    volumes:
      - ./runtime:/app/runtime

  caddy:
    container_name: selfchecks-prod-caddy
    depends_on:
      web:
        condition: service_started
    image: caddy:2-alpine
    networks:
      - selfchecks-prod
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - ./runtime/Caddyfile:/etc/caddy/Caddyfile
      - ./runtime/caddy-data:/data
      - ./runtime/caddy-config:/config
      - ./runtime/logs:/var/log/caddy
    expose:
      - "2019"

networks:
  selfchecks-prod:
    name: selfchecks-prod-network

volumes:
  selfchecks-prod-postgres-data:
    name: selfchecks-prod-postgres-data
  selfchecks-prod-redis-data:
    name: selfchecks-prod-redis-data
