services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: selfchecks
      POSTGRES_PASSWORD: selfchecks
      POSTGRES_USER: selfchecks
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selfchecks -d selfchecks"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
