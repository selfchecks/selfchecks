name: Deploy

on:
  push:
    branches:
      - stable
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/selfchecks/selfchecks-web
  WORKER_IMAGE: ghcr.io/selfchecks/selfchecks-worker
  CLI_IMAGE: ghcr.io/selfchecks/selfchecks-cli
  IMAGE_TAG: stable

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Format check
        run: yarn format:check

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test

      - name: Build
        run: yarn build

      - name: Build and smoke-test bootstrap installer
        run: yarn test:bootstrap

      - name: Validate production compose
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config

  prepare-release:
    needs: repo-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
      release_version: ${{ steps.release.outputs.release_version }}

    steps:
      - name: Checkout deploy source with the release key
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Create or reuse release commit
        id: release
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin stable
          remote_sha="$(git rev-parse FETCH_HEAD)"

          if [ "${remote_sha}" != "${GITHUB_SHA}" ]; then
            parent_sha="$(git show -s --format=%P "${remote_sha}")"

            if [ "${parent_sha}" != "${GITHUB_SHA}" ]; then
              echo "stable moved to ${remote_sha}; a newer workflow must release it" >&2
              exit 1
            fi

            git checkout --detach "${remote_sha}"
            release_version="$(node -p "require('./packages/checkly-compat/package.json').version")"
            release_subject="$(git show -s --format=%s "${remote_sha}")"
            expected_subject="chore(release): v${release_version} [skip ci]"

            if [ "${release_subject}" != "${expected_subject}" ]; then
              echo "stable moved to a commit that is not this workflow's release commit" >&2
              exit 1
            fi

            echo "Reusing ${expected_subject} (${remote_sha})"
            echo "release_sha=${remote_sha}" >> "${GITHUB_OUTPUT}"
            echo "release_version=${release_version}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          release_version="$(node scripts/bump-npm-package-versions.mjs)"

          git diff --check
          git diff --exit-code -- yarn.lock
          git add \
            packages/checkly-compat/package.json \
            packages/create-selfchecks/package.json \
            packages/create-selfchecks/src/templates.ts \
            packages/npm-cli/package.json \
            packages/npm-cli/src/version.ts
          git diff --cached --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): v${release_version} [skip ci]"

          release_sha="$(git rev-parse HEAD)"
          git push origin HEAD:stable

          echo "release_sha=${release_sha}" >> "${GITHUB_OUTPUT}"
          echo "release_version=${release_version}" >> "${GITHUB_OUTPUT}"

  build-images:
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate AppNotes build secret
        shell: bash
        env:
          APPNOTES_KEY: ${{ secrets.APPNOTES_KEY }}
        run: |
          if [ -z "${APPNOTES_KEY}" ]; then
            echo "Missing required GitHub secret: APPNOTES_KEY" >&2
            exit 1
          fi

      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/selfchecks/Dockerfile
          target: web
          push: true
          provenance: false
          tags: |
            ${{ env.WEB_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.WEB_IMAGE }}:sha-${{ needs.prepare-release.outputs.release_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/selfchecks/selfchecks
            org.opencontainers.image.description=Selfchecks web runtime image
          secrets: |
            APPNOTES_KEY=${{ secrets.APPNOTES_KEY }}
          cache-from: type=gha,scope=selfchecks-web
          cache-to: type=gha,mode=max,scope=selfchecks-web

      - name: Build and push worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/selfchecks/Dockerfile
          target: worker
          push: true
          provenance: false
          tags: |
            ${{ env.WORKER_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.WORKER_IMAGE }}:sha-${{ needs.prepare-release.outputs.release_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/selfchecks/selfchecks
            org.opencontainers.image.description=Selfchecks worker runtime image
          cache-from: type=gha,scope=selfchecks-worker
          cache-to: type=gha,mode=max,scope=selfchecks-worker

      - name: Build and push CLI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/selfchecks/Dockerfile
          target: cli
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.CLI_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.CLI_IMAGE }}:sha-${{ needs.prepare-release.outputs.release_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/selfchecks/selfchecks
            org.opencontainers.image.description=Selfchecks remote CLI image
          cache-from: type=gha,scope=selfchecks-cli
          cache-to: type=gha,mode=max,scope=selfchecks-cli

  publish-bootstrap:
    needs:
      - build-images
      - prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}

      - name: Build bootstrap installer
        run: bash scripts/build-bootstrap.sh output/bootstrap

      - name: Smoke-test bootstrap installer
        run: bash scripts/smoke-bootstrap.sh output/bootstrap

      - name: Publish rolling bootstrap release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          release_tag="bootstrap"

          if ! gh release view "${release_tag}" >/dev/null 2>&1; then
            gh release create "${release_tag}" \
              --target "${{ needs.prepare-release.outputs.release_sha }}" \
              --title "Selfchecks bootstrap installer" \
              --notes "Rolling installer assets generated from the stable branch."
          fi

          gh release upload "${release_tag}" \
            output/bootstrap/bootstrap.sh \
            output/bootstrap/selfchecks-bootstrap.tar.gz \
            --clobber

  publish-packages:
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}

      - name: Setup Node.js for npm
        uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          scope: "@selfchecks"

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.13.0 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build npm packages
        run: yarn build:npm-packages

      - name: Publish new package versions
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          for package_dir in packages/checkly-compat packages/npm-cli packages/create-selfchecks; do
            package_name="$(node -p "require('./${package_dir}/package.json').name")"
            package_version="$(node -p "require('./${package_dir}/package.json').version")"

            if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
              echo "${package_name}@${package_version} is already published"
              continue
            fi

            npm publish "./${package_dir}" --access public --provenance
          done

  smoke-create-selfchecks:
    needs:
      - prepare-release
      - publish-packages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Wait for published packages
        working-directory: ${{ runner.temp }}
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_version }}
        run: |
          set -euo pipefail

          packages=(
            @selfchecks/selfchecks
            @selfchecks/selfchecks-cli
            create-selfchecks
          )

          for attempt in {1..60}; do
            missing_packages=()

            for package_name in "${packages[@]}"; do
              if ! npm view "${package_name}@${RELEASE_VERSION}" version \
                --prefer-online \
                --cache "${RUNNER_TEMP}/npm-view-cache-${attempt}" \
                >/dev/null 2>&1; then
                missing_packages+=("${package_name}@${RELEASE_VERSION}")
              fi
            done

            if [ "${#missing_packages[@]}" -eq 0 ]; then
              npm_exec_cache="${RUNNER_TEMP}/npm-exec-cache-${attempt}"

              if NPM_CONFIG_CACHE="${npm_exec_cache}" \
                npx --yes "create-selfchecks@${RELEASE_VERSION}" --help \
                >/dev/null 2>&1; then
                echo "NPM_CONFIG_CACHE=${npm_exec_cache}" >> "${GITHUB_ENV}"
                echo "All release packages and the create-selfchecks executable are available from npm"
                break
              fi

              missing_packages+=("create-selfchecks@${RELEASE_VERSION} executable")
            fi

            if [ "${attempt}" = "60" ]; then
              echo "Packages are not available from npm: ${missing_packages[*]}" >&2
              exit 1
            fi

            echo "Waiting for npm registry: ${missing_packages[*]} (attempt ${attempt}/60)"
            sleep 5
          done

      - name: Create starter project from the release version
        working-directory: ${{ runner.temp }}
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_version }}
        run: npx --yes "create-selfchecks@${RELEASE_VERSION}" "${RUNNER_TEMP}/selfchecks-starter"

      - name: Typecheck starter project
        working-directory: ${{ runner.temp }}/selfchecks-starter
        run: npm run typecheck

      - name: Install Chromium
        working-directory: ${{ runner.temp }}/selfchecks-starter
        run: npx playwright install chromium

      - name: Run starter check
        working-directory: ${{ runner.temp }}/selfchecks-starter
        run: npm test

  deploy:
    needs:
      - build-images
      - prepare-release
      - publish-bootstrap
      - smoke-create-selfchecks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    environment:
      name: production
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      POSTGRES_USER: ${{ vars.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      NEXTAUTH_URL: ${{ vars.NEXTAUTH_URL }}
      SELFCHECKS_SETUP_TOKEN: ${{ secrets.SELFCHECKS_SETUP_TOKEN }}
      SELFCHECKS_API_TOKEN: ${{ secrets.SELFCHECKS_API_TOKEN }}
      SELFCHECKS_ADMIN_LOGIN: ${{ secrets.SELFCHECKS_ADMIN_LOGIN }}
      SELFCHECKS_ADMIN_PASSWORD: ${{ secrets.SELFCHECKS_ADMIN_PASSWORD }}
      SELFCHECKS_CHECKS_ROOT: ${{ vars.SELFCHECKS_CHECKS_ROOT }}
      SELFCHECKS_QUEUE_NAME: ${{ vars.SELFCHECKS_QUEUE_NAME }}
      SELFCHECKS_QUEUED_RUN_TIMEOUT_MINUTES: ${{ vars.SELFCHECKS_QUEUED_RUN_TIMEOUT_MINUTES }}
      SELFCHECKS_RUNNING_RUN_TIMEOUT_MINUTES: ${{ vars.SELFCHECKS_RUNNING_RUN_TIMEOUT_MINUTES }}
      SELFCHECKS_SCHEDULER_ENABLED: ${{ vars.SELFCHECKS_SCHEDULER_ENABLED }}
      SELFCHECKS_SCHEDULER_INTERVAL_MS: ${{ vars.SELFCHECKS_SCHEDULER_INTERVAL_MS }}
      SELFCHECKS_SCHEDULER_REPORTER: ${{ vars.SELFCHECKS_SCHEDULER_REPORTER }}
      SELFCHECKS_WEBHOOK_TIMEOUT_MS: ${{ vars.SELFCHECKS_WEBHOOK_TIMEOUT_MS }}
      SELFCHECKS_IMAGE_TAG: stable

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}

      - name: Validate deployment configuration
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail

          for required in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY POSTGRES_PASSWORD NEXTAUTH_SECRET; do
            if [ -z "${!required:-}" ]; then
              echo "Missing required GitHub variable/secret: ${required}" >&2
              exit 1
            fi
          done

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add SSH known hosts
        shell: bash
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -n "${DEPLOY_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts
          fi

          chmod 600 ~/.ssh/known_hosts

      - name: Prepare remote directory
        shell: bash
        run: |
          set -euo pipefail

          ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '${DEPLOY_PATH}'"

      - name: Sync deployment files to server
        shell: bash
        run: |
          set -euo pipefail

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT

          mkdir -p "${tmp_dir}/bootstrap"
          cp docker-compose.prod.yml "${tmp_dir}/docker-compose.prod.yml"
          cp bootstrap/Caddyfile.template "${tmp_dir}/bootstrap/Caddyfile.template"
          cp bootstrap/selfchecks.config.template.json "${tmp_dir}/bootstrap/selfchecks.config.template.json"

          rsync -az --delete \
            --exclude 'runtime/' \
            --exclude '.env' \
            --exclude '.ghcr-token' \
            --exclude '.ghcr-username' \
            -e "ssh -p ${DEPLOY_PORT:-22}" \
            "${tmp_dir}/" "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Upload production env
        shell: bash
        run: |
          set -euo pipefail

          POSTGRES_DB="${POSTGRES_DB:-selfchecks}"
          POSTGRES_USER="${POSTGRES_USER:-selfchecks}"
          DATABASE_URL="$(
            POSTGRES_DB="${POSTGRES_DB}" POSTGRES_USER="${POSTGRES_USER}" POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" python3 - <<'PY'
          import os
          from urllib.parse import quote

          database = quote(os.environ["POSTGRES_DB"], safe="")
          password = quote(os.environ["POSTGRES_PASSWORD"], safe="")
          user = quote(os.environ["POSTGRES_USER"], safe="")

          print(f"postgresql://{user}:{password}@postgres:5432/{database}?schema=public")
          PY
          )"
          NEXTAUTH_URL="${NEXTAUTH_URL:-}"
          SELFCHECKS_ADMIN_LOGIN="${SELFCHECKS_ADMIN_LOGIN:-}"
          SELFCHECKS_ADMIN_PASSWORD="${SELFCHECKS_ADMIN_PASSWORD:-}"
          SELFCHECKS_CHECKS_ROOT="${SELFCHECKS_CHECKS_ROOT:-}"
          SELFCHECKS_QUEUE_NAME="${SELFCHECKS_QUEUE_NAME:-selfchecks-checks}"
          SELFCHECKS_QUEUED_RUN_TIMEOUT_MINUTES="${SELFCHECKS_QUEUED_RUN_TIMEOUT_MINUTES:-30}"
          SELFCHECKS_RUNNING_RUN_TIMEOUT_MINUTES="${SELFCHECKS_RUNNING_RUN_TIMEOUT_MINUTES:-120}"
          SELFCHECKS_SCHEDULER_ENABLED="${SELFCHECKS_SCHEDULER_ENABLED:-1}"
          SELFCHECKS_SCHEDULER_INTERVAL_MS="${SELFCHECKS_SCHEDULER_INTERVAL_MS:-60000}"
          SELFCHECKS_SCHEDULER_REPORTER="${SELFCHECKS_SCHEDULER_REPORTER:-list}"
          SELFCHECKS_WEBHOOK_TIMEOUT_MS="${SELFCHECKS_WEBHOOK_TIMEOUT_MS:-5000}"

          if [ -z "${SELFCHECKS_SETUP_TOKEN:-}" ]; then
            SELFCHECKS_SETUP_TOKEN="$(
              ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
                "if [ -f '${DEPLOY_PATH}/.env' ]; then sed -n 's/^SELFCHECKS_SETUP_TOKEN=//p' '${DEPLOY_PATH}/.env' | head -n 1; fi"
            )"
          fi

          if [ -z "${SELFCHECKS_SETUP_TOKEN:-}" ]; then
            SELFCHECKS_SETUP_TOKEN="$(openssl rand -hex 32)"
          fi

          if [ -z "${SELFCHECKS_API_TOKEN:-}" ]; then
            SELFCHECKS_API_TOKEN="$(
              ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
                "if [ -f '${DEPLOY_PATH}/.env' ]; then sed -n 's/^SELFCHECKS_API_TOKEN=//p' '${DEPLOY_PATH}/.env' | head -n 1; fi"
            )"
          fi

          if [ -z "${SELFCHECKS_API_TOKEN:-}" ]; then
            SELFCHECKS_API_TOKEN="$(openssl rand -hex 32)"
          fi

          cat > .env.production <<EOF
          SELFCHECKS_IMAGE_TAG=${SELFCHECKS_IMAGE_TAG}

          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          DATABASE_URL=${DATABASE_URL}

          REDIS_HOST=redis
          REDIS_PORT=6379
          SELFCHECKS_QUEUE_NAME=${SELFCHECKS_QUEUE_NAME}
          SELFCHECKS_CHECKS_ROOT=${SELFCHECKS_CHECKS_ROOT}
          SELFCHECKS_QUEUED_RUN_TIMEOUT_MINUTES=${SELFCHECKS_QUEUED_RUN_TIMEOUT_MINUTES}
          SELFCHECKS_RUNNING_RUN_TIMEOUT_MINUTES=${SELFCHECKS_RUNNING_RUN_TIMEOUT_MINUTES}
          SELFCHECKS_SCHEDULER_ENABLED=${SELFCHECKS_SCHEDULER_ENABLED}
          SELFCHECKS_SCHEDULER_INTERVAL_MS=${SELFCHECKS_SCHEDULER_INTERVAL_MS}
          SELFCHECKS_SCHEDULER_REPORTER=${SELFCHECKS_SCHEDULER_REPORTER}

          NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
          NEXTAUTH_URL=${NEXTAUTH_URL}

          SELFCHECKS_SETUP_TOKEN=${SELFCHECKS_SETUP_TOKEN}
          SELFCHECKS_API_TOKEN=${SELFCHECKS_API_TOKEN}
          SELFCHECKS_ADMIN_LOGIN=${SELFCHECKS_ADMIN_LOGIN}
          SELFCHECKS_ADMIN_PASSWORD=${SELFCHECKS_ADMIN_PASSWORD}
          SELFCHECKS_CONFIG_PATH=/app/runtime/selfchecks.config.json
          SELFCHECKS_CADDY_CONFIG_PATH=/app/runtime/Caddyfile
          SELFCHECKS_CADDY_ADMIN_URL=http://caddy:2019
          SELFCHECKS_CADDY_ADMIN_ORIGIN=http://0.0.0.0:2019
          SELFCHECKS_CADDY_UPSTREAM=web:3000

          SELFCHECKS_ARTIFACTS_DIR=/app/runtime/artifacts
          SELFCHECKS_TEST_SESSIONS_DIR=/app/runtime/test-sessions
          SELFCHECKS_WEBHOOK_TIMEOUT_MS=${SELFCHECKS_WEBHOOK_TIMEOUT_MS}
          EOF

          sed -i 's/^          //' .env.production
          scp -P "${DEPLOY_PORT:-22}" .env.production "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/.env"

      - name: Upload GHCR pull credentials
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          set -euo pipefail

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT

          printf '%s' "${GHCR_USERNAME}" > "${tmp_dir}/.ghcr-username"
          printf '%s' "${GHCR_TOKEN}" > "${tmp_dir}/.ghcr-token"

          scp -P "${DEPLOY_PORT:-22}" \
            "${tmp_dir}/.ghcr-username" \
            "${tmp_dir}/.ghcr-token" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Deploy on server
        shell: bash
        run: |
          set -euo pipefail

          ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" "DEPLOY_PATH='${DEPLOY_PATH}' bash -s" <<'EOF'
          set -euo pipefail
          cd "${DEPLOY_PATH}"

          cleanup_ghcr_credentials() {
            if [ "${GHCR_LOGGED_IN:-0}" = "1" ]; then
              docker_cmd logout ghcr.io || true
            fi

            rm -f .ghcr-token .ghcr-username
          }
          trap cleanup_ghcr_credentials EXIT
          GHCR_LOGGED_IN=0

          SUDO=""
          if [ "$(id -u)" -ne 0 ]; then
            if command -v sudo >/dev/null 2>&1; then
              SUDO="sudo"
            else
              echo "Docker is missing and deploy user is not root or sudo-capable." >&2
              exit 1
            fi
          fi

          docker_cmd() {
            if [ -n "${SUDO}" ]; then
              "${SUDO}" docker "$@"
              return
            fi

            docker "$@"
          }

          as_root() {
            if [ -n "${SUDO}" ]; then
              "${SUDO}" "$@"
              return
            fi

            "$@"
          }

          install_base_packages() {
            if command -v apt-get >/dev/null 2>&1; then
              as_root apt-get update
              as_root apt-get install -y ca-certificates curl
              return
            fi

            if command -v dnf >/dev/null 2>&1; then
              as_root dnf install -y ca-certificates curl
              return
            fi

            if command -v yum >/dev/null 2>&1; then
              as_root yum install -y ca-certificates curl
              return
            fi

            echo "Unsupported Linux distribution. Install Docker manually." >&2
            exit 1
          }

          if ! command -v docker >/dev/null 2>&1; then
            install_base_packages
            curl -fsSL https://get.docker.com | as_root sh
          fi

          if command -v systemctl >/dev/null 2>&1; then
            as_root systemctl enable --now docker || true
          fi

          if ! docker_cmd compose version >/dev/null 2>&1; then
            compose_version="v2.39.4"
            os="$(uname -s)"
            arch="$(uname -m)"

            as_root mkdir -p /usr/local/lib/docker/cli-plugins
            as_root curl -fsSL \
              "https://github.com/docker/compose/releases/download/${compose_version}/docker-compose-${os}-${arch}" \
              -o /usr/local/lib/docker/cli-plugins/docker-compose
            as_root chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          fi

          if [ -f .ghcr-token ] && [ -f .ghcr-username ]; then
            docker_cmd login ghcr.io -u "$(cat .ghcr-username)" --password-stdin < .ghcr-token
            GHCR_LOGGED_IN=1
          fi

          mkdir -p runtime/artifacts runtime/caddy-data runtime/caddy-config runtime/logs

          if [ ! -f runtime/selfchecks.config.json ]; then
            cp bootstrap/selfchecks.config.template.json runtime/selfchecks.config.json
            chmod 600 runtime/selfchecks.config.json
          fi

          if [ ! -f runtime/Caddyfile ]; then
            cp bootstrap/Caddyfile.template runtime/Caddyfile
            chmod 600 runtime/Caddyfile
          fi

          CADDY_RESTART_REQUIRED=0
          if as_root grep -q 'X-Frame-Options "DENY"' runtime/Caddyfile; then
            as_root sed -i 's/X-Frame-Options "DENY"/X-Frame-Options "SAMEORIGIN"/g' runtime/Caddyfile
            CADDY_RESTART_REQUIRED=1
          fi

          if docker_cmd ps --format '{{.Names}}' | grep -qx 'selfchecks-prod-caddy'; then
            docker_cmd restart selfchecks-prod-caddy
          fi

          docker_cmd system prune -af || true
          docker_cmd compose --env-file .env -f docker-compose.prod.yml pull
          docker_cmd compose --env-file .env -f docker-compose.prod.yml up --force-recreate --abort-on-container-exit --exit-code-from migrate migrate
          docker_cmd logout ghcr.io || true
          GHCR_LOGGED_IN=0
          docker_cmd compose --env-file .env -f docker-compose.prod.yml up -d --remove-orphans
          if [ "${CADDY_RESTART_REQUIRED}" = "1" ]; then
            docker_cmd compose --env-file .env -f docker-compose.prod.yml restart caddy
          fi
          docker_cmd compose --env-file .env -f docker-compose.prod.yml ps
          EOF
